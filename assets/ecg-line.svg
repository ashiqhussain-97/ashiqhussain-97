<svg width="1200" height="200" viewBox="0 0 1200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="200" fill="#0D1117"/>
  <path d="M 0 100 L 300 100 L 320 100 L 330 80 L 340 120 L 350 100 L 600 100 L 620 100 L 630 60 L 640 140 L 650 100 L 900 100 L 920 100 L 930 70 L 940 130 L 950 100 L 1200 100" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dashoffset" values="2000;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </path>
  <!-- Moving dot at the end -->
  <circle r="5" fill="#EC4899">
    <animate attributeName="cx" values="0;1200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="100;100" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
