<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="radarGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  
  <rect width="400" height="400" fill="#0D1117"/>
  
  <!-- Radar rings -->
  <circle cx="200" cy="200" r="150" stroke="#00F0FF" stroke-width="1" fill="none" opacity="0.4"/>
  <circle cx="200" cy="200" r="100" stroke="#7C3AED" stroke-width="1" fill="none" opacity="0.6"/>
  <circle cx="200" cy="200" r="50" stroke="#EC4899" stroke-width="1" fill="none" opacity="0.8"/>
  
  <!-- Pulsing effect on rings -->
  <circle cx="200" cy="200" r="150" stroke="#00F0FF" stroke-width="2" fill="none" opacity="0">
    <animate attributeName="r" values="150;160;150" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Sweep line -->
  <line x1="200" y1="200" x2="200" y2="50" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="4s" repeatCount="indefinite"/>
  </line>
  
  <!-- Center dot -->
  <circle cx="200" cy="200" r="5" fill="#EC4899" filter="url(#glow)"/>
</svg>
