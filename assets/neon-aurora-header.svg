<svg width="1200" height="250" viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0.2"/>
      <stop offset="0.3" stop-color="#7C3AED" stop-opacity="0.8"/>
      <stop offset="0.7" stop-color="#EC4899" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Moving wave lines -->
  <path d="M0 150 Q 200 50 400 120 T 800 100 T 1200 130" stroke="url(#aurora)" stroke-width="8" fill="none" filter="url(#glow)">
    <animate attributeName="d" values="M0 150 Q 200 50 400 120 T 800 100 T 1200 130;M0 130 Q 200 150 400 90 T 800 130 T 1200 110;M0 150 Q 200 50 400 120 T 800 100 T 1200 130" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <path d="M0 180 Q 250 100 500 150 T 900 130 T 1200 160" stroke="#7C3AED" stroke-width="4" fill="none" opacity="0.7" filter="url(#glow)">
    <animate attributeName="d" values="M0 180 Q 250 100 500 150 T 900 130 T 1200 160;M0 160 Q 250 180 500 120 T 900 160 T 1200 140;M0 180 Q 250 100 500 150 T 900 130 T 1200 160" dur="8s" repeatCount="indefinite"/>
  </path>
  
  <!-- Floating particles -->
  <circle cx="100" cy="80" r="4" fill="#00F0FF" filter="url(#glow)">
    <animate attributeName="cx" values="100;400;100" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;30;80" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;5;2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="120" r="5" fill="#EC4899" filter="url(#glow)">
    <animate attributeName="cx" values="600;900;600" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;60;120" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;6;3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="70" r="3" fill="#7C3AED" filter="url(#glow)">
    <animate attributeName="cx" values="1000;1100;1000" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="70;150;70" dur="13s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Title text with glow -->
  <text x="600" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#FFFFFF" filter="url(#glow)">
    ASHIQ HUSSAIN
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
