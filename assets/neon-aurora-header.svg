<svg width="1200" height="250" viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blur">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="250" fill="#0D1117"/>
  
  <!-- Blurred to sharp text -->
  <text x="600" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="70" font-weight="bold" fill="url(#textGrad)" filter="url(#blur)" opacity="0.5">
    ASHIQ HUSSAIN
    <animate attributeName="filter" values="url(#blur);url(#glow);url(#blur)" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </text>
  
  <!-- Particles around name -->
  <circle cx="300" cy="120" r="4" fill="#00F0FF">
    <animate attributeName="cx" values="300;200;300" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;80;120" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="150" r="5" fill="#7C3AED">
    <animate attributeName="cx" values="900;1000;900" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;100;150" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="50" r="3" fill="#EC4899">
    <animate attributeName="cy" values="50;80;50" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
