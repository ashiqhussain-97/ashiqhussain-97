<svg width="1200" height="100" viewBox="0 0 1200 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#FF4500"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect width="1200" height="100" fill="#0D1117"/>
  
  <!-- Moving fire trail -->
  <path d="M0 50 Q 200 20 400 50 T 800 50 T 1200 50" stroke="url(#fire)" stroke-width="6" fill="none" filter="url(#glow)">
    <animate attributeName="d" values="M0 50 Q 200 20 400 50 T 800 50 T 1200 50;M0 50 Q 200 80 400 50 T 800 50 T 1200 50;M0 50 Q 200 20 400 50 T 800 50 T 1200 50" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Fire particles -->
  <circle r="5" fill="#00F0FF" filter="url(#glow)">
    <animate attributeName="cx" values="0;1200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="50;50" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;6;3" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#EC4899" filter="url(#glow)">
    <animate attributeName="cx" values="1200;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="50;50" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
