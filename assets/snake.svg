<svg width="1200" height="200" viewBox="0 0 1200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="200" fill="#0D1117"/>
  <path d="M 50 100 Q 150 50 250 100 T 450 100 T 650 100 T 850 100 T 1050 100" fill="none" stroke="#00F0FF" stroke-width="6" stroke-linecap="round">
